name: Deploy MkDocs (GitHub Pages)

on:
    pull_request:
        branches: [main]
        paths:
            - mkdocs.yml
            - docs/**
    push:
        branches: [main]
        paths:
            - mkdocs.yml
            - docs/**

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Pages
              uses: actions/configure-pages@v5

            - name: Install uv
              uses: astral-sh/setup-uv@v3

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install docs dependencies
              run: uv sync --group docs

            - name: Prepare docs example_data fixtures
              run: |
                  src_dir="${GITHUB_WORKSPACE}/example_data"
                  dest_dir="${GITHUB_WORKSPACE}/docs/site/example_data"

                  ls -la "${src_dir}"
                  mkdir -p "${dest_dir}"
                  cp "${src_dir}/messy_example.csv" "${dest_dir}/messy_example.csv"
                  cp "${src_dir}/canonical_example.csv" "${dest_dir}/canonical_example.csv"

            - name: Build site
              run: uv run mkdocs build --strict

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: site

    deploy:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
